AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Online shop web store - security groups and Secrets Manager entries.
  Mirrors architecture.md "Network & security": three prefix-scoped security
  groups chained ALB -> app -> DB inside the default VPC, plus two secrets:
    * ttw-db-password    - RDS master credentials, password auto-generated
      via GenerateSecretString (data stack resolves it at create time).
    * ttw-legacy-api-key - API key for the defunct third-party
      marketplace sync. Ops never overwrote the placeholder after the 2019
      integration was retired; the app only surfaces the secret's status on
      /admin/aws-check and never reads the value.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Default VPC id - resolved by scripts/deploy.sh (this stack never creates VPCs).
  AutoTeardownDate:
    Type: String
    Default: '2026-07-31'
    Description: ISO date - tag value so future-you can find these to clean up.

Resources:
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: ttw-alb-sg
      GroupDescription: Online shop ALB - HTTP from the internet (CloudFront in front has no static IPs the shop ever scoped down to).
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP from anywhere (CloudFront + direct)
      Tags:
        - {Key: Name, Value: ttw-alb-sg}
        - {Key: Owner, Value: migration-test}
        - {Key: CostCenter, Value: test-journeys}
        - {Key: AutoTeardown, Value: !Ref AutoTeardownDate}
        - {Key: Journey, Value: j2-three-tier-web}

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: ttw-app-sg
      GroupDescription: Online shop app instances - gunicorn :8000 from the ALB only.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          SourceSecurityGroupId: !Ref AlbSecurityGroup
          Description: gunicorn from ALB
      Tags:
        - {Key: Name, Value: ttw-app-sg}
        - {Key: Owner, Value: migration-test}
        - {Key: CostCenter, Value: test-journeys}
        - {Key: AutoTeardown, Value: !Ref AutoTeardownDate}
        - {Key: Journey, Value: j2-three-tier-web}

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: ttw-db-sg
      GroupDescription: Online shop PostgreSQL - 5432 from app instances only.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref AppSecurityGroup
          Description: PostgreSQL from app instances
      Tags:
        - {Key: Name, Value: ttw-db-sg}
        - {Key: Owner, Value: migration-test}
        - {Key: CostCenter, Value: test-journeys}
        - {Key: AutoTeardown, Value: !Ref AutoTeardownDate}
        - {Key: Journey, Value: j2-three-tier-web}

  DbPasswordSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: ttw-db-password
      Description: RDS PostgreSQL master credentials for online_shop. Password auto-generated; data stack consumes it via a secretsmanager dynamic reference.
      GenerateSecretString:
        SecretStringTemplate: '{"username":"shop"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludeCharacters: '"@/\'
      Tags:
        - {Key: Name, Value: ttw-db-password}
        - {Key: Owner, Value: migration-test}
        - {Key: CostCenter, Value: test-journeys}
        - {Key: AutoTeardown, Value: !Ref AutoTeardownDate}
        - {Key: Journey, Value: j2-three-tier-web}

  LegacyApiKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: ttw-legacy-api-key
      Description: API key for the retired third-party marketplace sync. Overwrite after deploy if the integration ever comes back; the store only checks that the secret exists.
      SecretString: '{"api_key":"PLACEHOLDER_OVERWRITE_AFTER_DEPLOY"}'
      Tags:
        - {Key: Name, Value: ttw-legacy-api-key}
        - {Key: Owner, Value: migration-test}
        - {Key: CostCenter, Value: test-journeys}
        - {Key: AutoTeardown, Value: !Ref AutoTeardownDate}
        - {Key: Journey, Value: j2-three-tier-web}

Outputs:
  AlbSgId:
    Value: !Ref AlbSecurityGroup
    Export: {Name: !Sub '${AWS::StackName}-AlbSgId'}
  AppSgId:
    Value: !Ref AppSecurityGroup
    Export: {Name: !Sub '${AWS::StackName}-AppSgId'}
  DbSgId:
    Value: !Ref DbSecurityGroup
    Export: {Name: !Sub '${AWS::StackName}-DbSgId'}
  DbPasswordSecretArn:
    Value: !Ref DbPasswordSecret
    Export: {Name: !Sub '${AWS::StackName}-DbPasswordSecretArn'}
  LegacyApiKeySecretArn:
    Value: !Ref LegacyApiKeySecret
    Export: {Name: !Sub '${AWS::StackName}-LegacyApiKeySecretArn'}
