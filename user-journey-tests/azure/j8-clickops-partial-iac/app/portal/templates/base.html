<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}{{ university }}{% endblock %}</title>
    <style>
      body {
        font-family: system-ui, "Hiragino Sans", sans-serif;
        margin: 0 auto;
        max-width: 52rem;
        padding: 1.5rem;
        line-height: 1.6;
        color: #1c1c1c;
      }
      header {
        border-bottom: 3px solid #3d5a80;
        margin-bottom: 1.5rem;
        padding-bottom: 0.75rem;
      }
      header h1 {
        font-size: 1.4rem;
        margin: 0;
      }
      header p {
        color: #5a5a5a;
        margin: 0.25rem 0 0;
      }
      nav a {
        color: #3d5a80;
        margin-right: 1rem;
        text-decoration: none;
      }
      table {
        border-collapse: collapse;
        width: 100%;
      }
      th,
      td {
        border-bottom: 1px solid #dcdcdc;
        padding: 0.5rem 0.4rem;
        text-align: left;
        vertical-align: top;
      }
      .category {
        background: #eef2f7;
        border-radius: 3px;
        color: #3d5a80;
        font-size: 0.8rem;
        padding: 0.1rem 0.45rem;
        white-space: nowrap;
      }
      .posted {
        color: #5a5a5a;
        white-space: nowrap;
      }
      .unavailable {
        background: #fdf3f2;
        border-left: 4px solid #b3423b;
        padding: 0.75rem 1rem;
      }
      footer {
        border-top: 1px solid #dcdcdc;
        color: #767676;
        font-size: 0.85rem;
        margin-top: 2.5rem;
        padding-top: 0.75rem;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>{{ university }}</h1>
      <p>Student portal</p>
      <nav>
        <a href="/">Notice board</a>
        <a href="/documents">Documents</a>
      </nav>
    </header>
    <main>{% block content %}{% endblock %}</main>
    <footer>
      Enquiries: the student office, Building 1 &middot;
      <a href="https://www.cpi.example">cpi.example</a>
    </footer>
  </body>
</html>
