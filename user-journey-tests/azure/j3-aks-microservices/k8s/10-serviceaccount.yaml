# Pod identity.
#
# One service account for both services. The annotation names the client id of
# the user-assigned identity in Entra ID; the mutating webhook that AKS runs
# when workload identity is enabled reads it, projects a signed service-account
# token into every pod that carries the azure.workload.identity/use label, and
# sets AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_FEDERATED_TOKEN_FILE and
# AZURE_AUTHORITY_HOST on the containers.
#
# The Entra side of the binding — the identity itself and the federated
# credential that trusts this exact namespace/name pair — is in
# ../terraform/identity.tf. Rename either half and the pods lose their
# credentials with no error until the first Azure call fails.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: akm-workload
  namespace: tracking
  labels:
    app.kubernetes.io/part-of: parcel-tracking
  annotations:
    azure.workload.identity/client-id: "${WORKLOAD_IDENTITY_CLIENT_ID}"
