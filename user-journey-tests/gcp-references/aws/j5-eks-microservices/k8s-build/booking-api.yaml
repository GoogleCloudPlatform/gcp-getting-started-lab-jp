apiVersion: v1
kind: ServiceAccount
metadata:
  name: booking-api
  namespace: ems
  labels:
    app: booking-api
    app.kubernetes.io/part-of: ems-marketplace
  annotations:
    iam.gke.io/gcp-service-account: ems-booking-gsa@aws-migration-501814.iam.gserviceaccount.com
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-api
  namespace: ems
  labels:
    app: booking-api
    app.kubernetes.io/part-of: ems-marketplace
spec:
  replicas: 2
  selector:
    matchLabels:
      app: booking-api
  template:
    metadata:
      labels:
        app: booking-api
        app.kubernetes.io/part-of: ems-marketplace
    spec:
      serviceAccountName: booking-api
      containers:
      - name: booking-api
        image: asia-northeast1-docker.pkg.dev/aws-migration-501814/ems/ems-booking-api:latest
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: PORT
          value: '8080'
        - name: TABLE_NAME
          value: ems-bookings
        - name: CATALOG_URL
          value: http://catalog-api:8080
        - name: GCP_PROJECT
          value: aws-migration-501814
        - name: FIRESTORE_DB
          value: ems-bookings
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: booking-api
  namespace: ems
  labels:
    app: booking-api
    app.kubernetes.io/part-of: ems-marketplace
  annotations: {}
spec:
  type: LoadBalancer
  selector:
    app: booking-api
  ports:
  - name: http
    port: 80
    targetPort: http
